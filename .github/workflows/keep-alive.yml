# Keeps the free sleuth-prod Supabase project from pausing (it pauses after low activity over
# 7 days; see docs/deploy-plan.md "Keep-alive"). One cheap read-only query, twice a week.
# Prints "ok" or "error <exit code>" and nothing else: no host, no row data, no error text.
# The DATABASE_URL repository secret is the production session pooler URL (the worker uses it too).
name: keep-alive

on:
  schedule:
    # Mondays and Thursdays at 03:17 UTC. Not on the hour, because the start of every hour is
    # when scheduled runs are most often late.
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
  # Runs once on a pull request that changes this file, so a change is proven before merge.
  pull_request:
    paths:
      - .github/workflows/keep-alive.yml

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    # Only the team's repository; never a fork.
    if: github.repository == 'dngvmnh/sleuth'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One read-only query against sleuth-prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGCONNECT_TIMEOUT: "20"
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "error missing_secret"; exit 1; fi
          # psql (libpq) refuses query parameters it does not know, such as the pooler's
          # "pgbouncer=true" that the worker's driver accepts. Drop the query string; ask for TLS.
          url="${DATABASE_URL%%\?*}?sslmode=require"
          if psql "$url" -X -q -t -A -v ON_ERROR_STOP=1 \
               -c "select count(*) from projects where is_demo" > /dev/null 2>&1; then
            echo "ok"
          else
            code=$?
            echo "error $code"
            exit 1
          fi
