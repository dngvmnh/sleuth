              schema: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  minLength: 1
                  maxLength: 200
                mimeType:
                  type: string
                  enum:
                    - video/mp4
                    - video/quicktime
                    - video/webm
                    - video/x-matroska
                sizeBytes:
                  type: integer
                  minimum: 0
