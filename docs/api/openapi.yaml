                        maximum: 9007199254740991
                      storagePath:
                        type: string
                        minLength: 1
                      mimeType:
                        type: string
                        minLength: 1
                      durationMs:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      createdAt:
                        type: string
