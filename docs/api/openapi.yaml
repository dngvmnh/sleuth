                    required:
                      - id
                      - projectId
                      - version
                      - text
                      - segments
                      - createdAt
                    additionalProperties: false
                  diff:
                    type: object
                    properties:
                      added:
                        type: array
                        items:
                          type: string
                          minLength: 1
                      modified:
                        type: array
                        items:
                          type: string
                          minLength: 1
                      removed:
                        type: array
                        items:
                          type: string
                          minLength: 1
                      unchanged:
