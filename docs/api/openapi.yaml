                              maximum: 9007199254740991
                            text:
                              type: string
                              minLength: 1
                            hash:
                              type: string
                              pattern: ^[0-9a-f]{64}$
                          required:
                            - id
                            - scriptVersionId
                            - index
                            - text
                            - hash
                          additionalProperties: false
